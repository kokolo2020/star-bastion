<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Bastion · Sector Preview</title><style>body{background:#050a17;margin:0;padding:24px;color:#e9f3ff;font:14px system-ui}main{max-width:1380px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}h1{font-size:25px;margin:0}header span{color:#8aa3c8;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#0d192c;border:1px solid #466a8a55;border-radius:12px;overflow:hidden}canvas{width:100%;display:block;aspect-ratio:16/9}footer{padding:12px;display:flex;justify-content:space-between;font-size:12px}footer span{color:#8aa3c8}</style><main><header><h1>STAR BASTION / SIX SPACE REGIONS</h1><span>New scenery every five waves · Host + phone synchronized</span></header><div class="grid" id="regions"></div></main><script src="../regions.js"></script><script>SpaceRegions.all.forEach((r,i)=>{const a=document.createElement('article'),c=document.createElement('canvas'),f=document.createElement('footer'),b=document.createElement('b'),s=document.createElement('span');c.width=1280;c.height=720;b.textContent=r.name;b.style.color=r.accent;s.textContent='WAVES '+(i*5+1)+'–'+(i*5+5);f.append(b,s);a.append(c,f);document.getElementById('regions').append(a);SpaceRegions.draw(c.getContext('2d'),1280,720,r.id,0,{reducedMotion:true})});</script></html>
