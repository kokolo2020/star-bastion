<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Bastion Co-op: Host Screen</title>
<style>
html,body{margin:0;height:100%;background:#03040c;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="net.js"></script>
<script>
(()=>{
'use strict';
const FW=1280,FH=720,TOPY=64,WALL=540,NS=10,NSL=6,SWD=FW/NS,RS=1.45,MAXP=NS;
const SCOL=['#35e6ff','#ff5de0','#5dff7a','#ffa63d','#8aa8ff','#ffe03d','#ff6b6b','#b07aff','#4ee0c0','#e8eeff'];
const TY=[
 {n:'PULSE', c:50, d:9,  r:.26,rg:175,col:'#35e6ff'},
 {n:'CANNON',c:100,d:34, r:1.15,rg:195,col:'#ffa63d'},
 {n:'LASER', c:140,d:5.5,r:.14,rg:150,col:'#5dff7a'},
 {n:'FROST', c:90, d:4,  r:.55,rg:160,col:'#8aa8ff'},
 {n:'RAIL',  c:200,d:95, r:1.6,rg:260,col:'#ff5de0'}
];
const EN={
 scout:   {hp:22, sp:58,r:8, rw:4, fd:2, col:'#ff5577'},
 grunt:   {hp:55, sp:38,r:10,rw:6, fd:3, col:'#ffa040'},
 swarm:   {hp:11, sp:75,r:6, rw:2, fd:1, col:'#e060ff'},
 shield:  {hp:70, sh:60,sp:34,r:11,rw:11,fd:4,col:'#40e0ff'},
 splitter:{hp:90, sp:34,r:12,rw:10,fd:4, col:'#a070ff'},
 tank:    {hp:220,sp:24,r:16,rw:18,fd:8, col:'#e05050'},
 boss:    {hp:1400,sp:15,r:30,rw:160,fd:30,col:'#ff3050'}
};
const CARDS=[
 {id:'dmg',n:'Overcharge',d:'+20% damage, all towers',f:g=>g.dmg*=1.2,col:'#ff8a3d'},
 {id:'rate',n:'Rapid Fire',d:'+15% fire rate, all towers',f:g=>g.rate*=1.15,col:'#35e6ff'},
 {id:'range',n:'Long Range',d:'+12% range, all towers',f:g=>g.range*=1.12,col:'#5dff7a'},
 {id:'siph',n:'Energy Siphon',d:'+25% energy from kills',f:g=>g.siph+=.25,col:'#ffe03d'},
 {id:'repair',n:'Field Repair',d:'Restore 40 fortress HP',f:g=>g.hp=Math.min(g.maxHp,g.hp+40),col:'#ff6688'},
 {id:'wall',n:'Reinforced Wall',d:'+40 max HP and heal 40',f:g=>{g.maxHp+=40;g.hp+=40},col:'#ff6688'},
 {id:'drop',n:'Supply Drop',d:'+140 energy for everyone',f:g=>{for(const id in players)players[id].en+=140},col:'#ffe03d'},
 {id:'cryo',n:'Cryo Coating',d:'Pulse & cannon hits slow enemies',f:g=>g.cryo++,col:'#8aa8ff'},
 {id:'pierce',n:'Piercing Rounds',d:'Pulse shots pierce +1 enemy',f:g=>g.pierce++,col:'#35e6ff'},
 {id:'splash',n:'Blast Radius',d:'+30% cannon splash',f:g=>g.splash*=1.3,col:'#ffa63d'},
 {id:'crit',n:'Critical Core',d:'+12% chance for double damage',f:g=>g.crit+=.12,col:'#ff5de0'},
 {id:'bargain',n:'Bargain Bin',d:'-10% build & upgrade costs',f:g=>g.disc=Math.min(.5,g.disc+.1),col:'#ffe03d'}
];

/* ---------- canvas ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=1920;cv.height=1080;
function fit(){const s=Math.min(innerWidth/FW,innerHeight/FH);cv.style.width=(FW*s)+'px';cv.style.height=(FH*s)+'px'}
addEventListener('resize',fit);fit();

/* ---------- room & network ---------- */
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ';
function pickRoom(){
 let r=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
 if(!r){try{r=localStorage.getItem('sb_room')||''}catch(e){}}
 if(!r){r='';for(let i=0;i<4;i++)r+=ALPH[Math.floor(Math.random()*ALPH.length)]}
 try{localStorage.setItem('sb_room',r)}catch(e){}
 return r;
}
const ROOM=pickRoom();
let netStatus='connecting',netMode='local',netDetail='';
let net=null;
function joinUrl(){
 const base=new URL('play.html',location.href);base.search='?room='+ROOM;
 const cfg=window.SBNet.getCfg();
 return base.toString()+(cfg?'#cfg='+window.SBNet.encodeCfg(cfg):'');
}
function shortUrl(){const b=new URL('play.html',location.href);return b.host+b.pathname+'?room='+ROOM}
let qrCanvas=null;
let qrN=0,qrM=null;const qrCache={};
function makeQR(){
 try{
  if(!window.QRCode)return;
  const holder=document.createElement('div');
  const q=new window.QRCode(holder,{text:joinUrl(),width:256,height:256,correctLevel:window.QRCode.CorrectLevel.M});
  qrCanvas=holder.querySelector('canvas');
  const o=q._oQRCode;
  if(o){qrN=o.getModuleCount();qrM=[];for(let r=0;r<qrN;r++)for(let c=0;c<qrN;c++)qrM.push(o.isDark(r,c)?1:0)}
 }catch(e){qrCanvas=null;qrN=0}
}

/* ---------- state ---------- */
let state='prep',G,players={},enemies=[],bullets=[],beams=[],parts=[],floats=[],towers=[],queue=[],feed=[];
let qrBig=false,eid=0,lastFx=0,fxHad=false,spawnT=0,T=0,shake=0,hurt=0,banner=null,waveTotal=0,nova=null,flashW=0,prepT=45,startIn=null,voteT=0,votes={},choices=[],overT=0,snapT=0,snapSeq=0,lastResult='';
let best=0;try{best=+localStorage.getItem('sb_best')||0}catch(e){}
const stars=[];for(let i=0;i<150;i++){const l=Math.random();stars.push({x:Math.random()*FW,y:Math.random()*FH,s:l<.6?.8:l<.9?1.4:2.2,v:l<.6?5:l<.9?12:26,tw:Math.random()*6})}

function newG(){return{hp:120,maxHp:120,wave:0,kills:0,charge:0,dmg:1,rate:1,range:1,siph:0,crit:0,pierce:0,splash:1,cryo:0,disc:0,picks:{}}}
function stationed(){return Object.values(players).filter(p=>p.s>=0)}
function owners(){const o=Array(NS).fill(null);for(const id in players){const p=players[id];if(p.s>=0)o[p.s]=p}return o}
function say(s,col){feed.push({s,t:6,col:col||'#c9d4ff'});if(feed.length>5)feed.shift()}
function newRound(){
 G=newG();enemies=[];bullets=[];beams=[];parts=[];floats=[];towers=[];queue=[];nova=null;banner=null;flashW=0;shake=0;hurt=0;
 for(const id in players){const p=players[id];p.en=160;p.rd=false;p.kills=0;p.sl=Array(NSL).fill(null)}
 state='prep';prepT=45;startIn=null;
}
function slotXY(s,i){return{x:s*SWD+(SWD-120)/2+20+(i%3)*40,y:WALL+78+Math.floor(i/3)*56}}
const cost=c=>Math.round(c*(1-G.disc));
function st(t){const b=TY[t.k],m=1+.55*(t.l-1);return{d:b.d*m*G.dmg,r:b.r*Math.pow(.93,t.l-1)/G.rate,rg:b.rg*RS*G.range*(1+.04*(t.l-1))}}
function upCost(t){return cost(Math.round(TY[t.k].c*.8*t.l))}
function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgba(h,a){const c=rgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function light(h,t){const c=rgb(h);return'rgb('+Math.round(c[0]+(255-c[0])*t)+','+Math.round(c[1]+(255-c[1])*t)+','+Math.round(c[2]+(255-c[2])*t)+')'}

/* ---------- waves ---------- */
function hpMul(w){return Math.pow(1.1,w-1)*(1+.1*(w-1))}
function buildWave(w){
 const n=Math.max(1,stationed().length);
 const list=[];let budget=(10+w*4.5)*(.65+.55*(n-1));
 const pool=[['scout',1,Math.max(.4,3-w*.15)],['grunt',2,2]];
 if(w>=3)pool.push(['swarm',.5,2]);
 if(w>=4)pool.push(['shield',3,1.2+w*.05]);
 if(w>=6)pool.push(['splitter',4,1.2]);
 if(w>=7)pool.push(['tank',6,1+w*.06]);
 while(budget>0){
  let tot=0;pool.forEach(p=>tot+=p[2]);let r=Math.random()*tot,pick=pool[0];
  for(const p of pool){r-=p[2];if(r<=0){pick=p;break}}
  list.push(pick[0]);budget-=pick[1];
  if(pick[0]==='swarm'){for(let i=0;i<3;i++)list.push('swarm')}
 }
 if(w%5===0){const nb=1+Math.floor(n/4);for(let i=0;i<nb;i++)list.splice(Math.floor(list.length/3)+i*3,0,'boss')}
 return list;
}
function idleCheck(){
 for(const id of Object.keys(players)){
  const p=players[id];
  if(p.acted){p.idle=0;p.acted=false;continue}
  p.idle=(p.idle||0)+1;
  if(p.idle>=3){towers=towers.filter(t=>t.o!==id);delete players[id];say(p.nm+' removed (inactive)','#8a97c8');if(net)net.send({t:'toast',to:id,m:'Removed for inactivity. Rejoin to play.'})}
  else if(p.idle===2&&net)net.send({t:'toast',to:id,m:'Inactive: tap something or you will be removed next round'});
 }
}
function startWave(){
 if(G.wave>0)idleCheck();
 G.wave++;queue=buildWave(G.wave);waveTotal=queue.length;spawnT=1.4;state='wave';startIn=null;
 for(const id in players)players[id].rd=false;
 const boss=G.wave%5===0;
 banner=boss?{t:3,txt:'⚠ WARNING ⚠',sub:'BOSS INCOMING',col:'#ff3050',boss:1}:{t:2,txt:'WAVE '+G.wave,sub:'',col:'#35e6ff'};
 pushSnap();
}
function spawnX(r){
 const own=owners().map((p,i)=>p?i:-1).filter(i=>i>=0);
 let x;
 if(own.length&&Math.random()<.85){const s=own[Math.floor(Math.random()*own.length)];x=(s+.5)*SWD+(Math.random()-.5)*SWD*1.2}
 else x=30+Math.random()*(FW-60);
 return Math.max(r+4,Math.min(FW-r-4,x));
}
function spawn(type,x,y){
 const b=EN[type],hm=hpMul(G.wave),bm=type==='boss'?1+.35*(G.wave/5-1):1;
 const hp=b.hp*hm*bm;
 enemies.push({id:++eid,k:type,x:x==null?spawnX(b.r):x,y:y==null?TOPY+10:y,hp,mhp:hp,sh:(b.sh||0)*hm,sp:b.sp*(.9+Math.random()*.2),r:b.r,rw:b.rw,fd:b.fd,col:b.col,sa:0,st:0,fl:0,ph:Math.random()*6,last:null});
}
function waveClear(){
 const bonus=50+G.wave*12;
 for(const id in players)players[id].en+=bonus;
 addCharge(10);say('Wave '+G.wave+' cleared  +'+bonus+' energy each','#5dff7a');
 if(G.wave>best){best=G.wave;try{localStorage.setItem('sb_best',String(best))}catch(e){}}
 const pool=CARDS.slice(),pick=[];
 while(pick.length<3){pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0])}
 choices=pick;votes={};voteT=15;state='cards';pushSnap();
}
function resolveVotes(){
 const tally=choices.map(()=>0);for(const id in votes)tally[votes[id]]++;
 const mx=Math.max(...tally),top=tally.map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
 const w=top[Math.floor(Math.random()*top.length)],c=choices[w];
 c.f(G);G.picks[c.id]=(G.picks[c.id]||0)+1;lastResult=c.n;say('Team upgrade: '+c.n,c.col);
 state='prep';prepT=20;startIn=null;for(const id in players)players[id].rd=false;pushSnap();
}

/* ---------- combat ---------- */
function burst(x,y,col,n,sp){sp=sp||90;for(let i=0;i<n;i++){const a=Math.random()*6.28,s=30+Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.3,max:.75,col,sz:1+Math.random()*2.2})}}
function ring(x,y,r,col){parts.push({x,y,ring:1,r,life:.35,max:.35,col})}
function boom(x,y,r,col){parts.push({x,y,fl:1,r:r*1.3,life:.22,max:.22,col});ring(x,y,r,col);burst(x,y,col,Math.round(8+r/4),110+r)}
function addFloat(x,y,s,c){if(floats.length<60)floats.push({x,y,t:c?.9:.6,s:String(s),c})}
function slow(e,a,t){if(e.k==='boss')a*=.5;e.sa=Math.max(e.sa,a);e.st=Math.max(e.st,t)}
function dmg(e,d,crit,o){
 if(e.hp<=0)return;
 if(o)e.last=o;
 if(e.sh>0){const x=Math.min(e.sh,d);e.sh-=x;d-=x}
 e.hp-=d;e.fl=.08;
 if(d>=18||crit)addFloat(e.x+(Math.random()*10-5),e.y-e.r,Math.round(d),crit);
 if(e.hp<=0)kill(e);
}
function kill(e){
 const rw=Math.round(e.rw*(1+.06*(G.wave-1))*(1+G.siph)),k=players[e.last];
 for(const id in players){const p=players[id];if(p.s<0)continue;p.en+=(id===e.last)?rw:Math.round(rw*.2)}
 if(k){k.kills++;k.pts=(k.pts||0)+rw}
 G.kills++;addCharge(e.k==='boss'?20:1.4+e.r*.09);
 if(e.k==='boss'){boom(e.x,e.y,100,'#ff3050');boom(e.x,e.y,56,'#ffe03d');burst(e.x,e.y,'#ffffff',40,200);shake=Math.max(shake,12)}
 else if(e.r>=12)boom(e.x,e.y,e.r*2,e.col);
 else burst(e.x,e.y,e.col,7);
 if(rw>=8)addFloat(e.x,e.y+10,'+'+rw,0);
 if(e.k==='splitter'){for(let i=0;i<3;i++)spawn('swarm',e.x+(i-1)*12,e.y)}
}
function target(t,rg){let b=null;for(const e of enemies){if(e.hp<=0)continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<=rg+e.r&&(!b||e.y>b.y))b=e}return b}
function fire(t){
 const s=st(t),e=target(t,s.rg);if(!e)return false;
 t.ang=Math.atan2(e.y-t.y,e.x-t.x);let d=s.d,crit=false;if(Math.random()<G.crit){d*=2;crit=true}
 t.fl=.09;
 const mk=(sp,extra)=>Object.assign({x:t.x,y:t.y,px:t.x,py:t.y,sp,vx:Math.cos(t.ang)*sp,vy:Math.sin(t.ang)*sp,d,crit,tg:e,life:2.2,k:t.k,o:t.o},extra||{});
 switch(t.k){
  case 0:bullets.push(mk(480,{pr:G.pierce,hit:new Set()}));break;
  case 1:bullets.push(mk(300,{sr:(48+t.l*3)*G.splash}));break;
  case 2:dmg(e,d,crit,t.o);beams.push({x1:t.x,y1:t.y,x2:e.x,y2:e.y,t:.09,m:.09,col:TY[2].col,w:2});break;
  case 3:bullets.push(mk(340));break;
  case 4:{
   const dx=Math.cos(t.ang),dy=Math.sin(t.ang);
   for(const o of enemies){if(o.hp<=0)continue;const px=o.x-t.x,py=o.y-t.y,pr=px*dx+py*dy;if(pr<0)continue;const dist=Math.abs(px*dy-py*dx);if(dist<o.r+5)dmg(o,d,crit,t.o)}
   beams.push({x1:t.x,y1:t.y,x2:t.x+dx*900,y2:t.y+dy*900,t:.2,m:.2,col:TY[4].col,w:5});shake=Math.max(shake,1);break;
  }
 }
 t.cd=s.r;return true;
}
function hitB(b,e){
 if(b.k===0){dmg(e,b.d,b.crit,b.o);burst(b.x,b.y,TY[0].col,3,60);if(G.cryo)slow(e,Math.min(.5,.18*G.cryo),1.2)}
 else if(b.k===1){
  boom(b.x,b.y,b.sr,TY[1].col);shake=Math.max(shake,1.5);
  for(const o of enemies){if(o.hp>0&&Math.hypot(o.x-b.x,o.y-b.y)<b.sr+o.r){dmg(o,b.d,b.crit,b.o);if(G.cryo)slow(o,Math.min(.5,.18*G.cryo),1.2)}}
 }else if(b.k===3){
  ring(b.x,b.y,44,TY[3].col);burst(b.x,b.y,TY[3].col,8,70);
  for(const o of enemies){if(o.hp>0&&Math.hypot(o.x-b.x,o.y-b.y)<44+o.r){dmg(o,b.d,b.crit,b.o);slow(o,.45,1.8)}}
 }
}

/* ---------- NOVA ---------- */
function addCharge(n){
 if(G.charge>=100)return;
 G.charge=Math.min(100,G.charge+n);
 if(G.charge>=100){say('⚡ NOVA READY ⚡','#ffe03d');ring(FW/2,WALL-20,200,'#ffe03d');boom(FW/2,WALL-20,80,'#ffe03d')}
}
function useNova(p){
 if(state!=='wave')return'Use NOVA during a wave';
 if(G.charge<100||nova)return;
 G.charge=0;nova={ph:'charge',t:0,y:WALL,hit:new Set(),by:p?p.nm:''};
 say((p?p.nm:'Someone')+' fired NOVA!','#ffe03d');
}
function novaHit(e){
 const hm=hpMul(G.wave);
 const d=e.k==='boss'?e.mhp*.2:Math.max(e.mhp*.5,80*hm);
 e.sh=0;dmg(e,d,true,nova&&nova.byId);
 if(e.hp>0){slow(e,.85,3.5);ring(e.x,e.y,e.r*2.6,'#9fd8ff');burst(e.x,e.y,'#ffffff',6,80)}
}
function updateNova(dt){
 if(!nova)return;
 nova.t+=dt;
 if(nova.ph==='charge'){
  if(Math.random()<.9)burst(FW/2+(Math.random()-.5)*500,WALL+Math.random()*50,'#ffe03d',1,30);
  if(nova.t>=.8){
   nova.ph='blast';nova.t=0;nova.y=WALL;flashW=1;shake=Math.max(shake,18);
   banner={t:1.8,txt:'NOVA BURST',sub:nova.by?'fired by '+nova.by:'',col:'#ffe03d'};
   boom(FW/2,WALL-10,180,'#ffffff');
  }
 }else{
  nova.y-=760*dt;
  for(let i=0;i<8;i++)parts.push({x:Math.random()*FW,y:nova.y+(Math.random()-.5)*20,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,life:.5,max:.5,col:Math.random()<.5?'#ffffff':'#ffe03d',sz:1+Math.random()*2.4});
  for(const e of enemies){if(e.hp>0&&!nova.hit.has(e)&&nova.y<=e.y+e.r){nova.hit.add(e);novaHit(e)}}
  shake=Math.max(shake,5);
  if(nova.y<TOPY-40)nova=null;
 }
}

/* ---------- player actions ---------- */
function toast(p,m){if(net)net.send({t:'toast',to:p.id,m})}
function doBuild(p,i,k){
 if(state!=='prep'&&state!=='wave')return'Not now';
 if(p.s<0)return'Pick a station first';
 if(!(i>=0&&i<NSL)||p.sl[i])return'Slot taken';
 k=k|0;if(!TY[k])return'Bad tower';
 const c=cost(TY[k].c);if(p.en<c)return'Not enough energy';
 p.en-=c;const xy=slotXY(p.s,i),t={k,l:1,x:xy.x,y:xy.y,cd:.3,ang:null,fl:0,o:p.id,si:i};
 p.sl[i]=t;towers.push(t);boom(t.x,t.y,26,TY[k].col);
}
function doUp(p,i){
 if(state!=='prep'&&state!=='wave')return'Not now';
 const t=p.sl[i];if(!t)return'Empty slot';if(t.l>=5)return'Max level';
 const c=upCost(t);if(p.en<c)return'Not enough energy';
 p.en-=c;t.l++;boom(t.x,t.y,30,'#ffe03d');
}
function doSell(p,i){
 if(state!=='prep')return'Sell between waves';
 const t=p.sl[i];if(!t)return'Empty slot';
 let spent=TY[t.k].c;for(let l=1;l<t.l;l++)spent+=Math.round(TY[t.k].c*.8*l);
 p.en+=Math.round(spent*.6);towers=towers.filter(x=>x!==t);p.sl[i]=null;burst(t.x,t.y,'#ffffff',10);
}
function onMsg(m){
 if(!m||typeof m!=='object'||!m.t)return;
 if(m.t==='hello'){pushSnap();return}
 if(!m.id||typeof m.id!=='string'||m.id.length>40)return;
 let p=players[m.id];
 if(m.t==='join'){
  const nm=String(m.nm||'Player').replace(/[^\w \-.]/g,'').trim().slice(0,12)||'Player';
  if(!p){
   if(Object.keys(players).length>=40){toast({id:m.id},'Room is full');return}
   p={id:m.id,nm,s:-1,en:160,rd:false,seen:Date.now(),kills:0,pts:0,sl:Array(NSL).fill(null)};players[m.id]=p;say(nm+' joined','#8aa8ff');
  }else{p.nm=nm}
  p.seen=Date.now();pushSnap();return;
 }
 if(!p)return;
 p.seen=Date.now();if(m.t!=='bye')p.bye=0;
 if(['claim','build','up','sell','nova','vote','ready'].includes(m.t))p.acted=true;
 let err=null;
 switch(m.t){
  case'hb':return;
  case'bye':p.bye=Date.now();return;
  case'claim':{
   const s=m.s|0;if(!(s>=0&&s<NS)){err='Bad station';break}
   const o=owners()[s];if(o&&o!==p){err='Station taken';break}
   if(p.s>=0&&p.s!==s&&p.sl.some(x=>x)){err='Sell your turrets to move';break}
   if(p.s<0&&stationed().length>=MAXP){err='All stations full';break}
   if(p.s!==s){p.s=s;say(p.nm+' took station '+(s+1),SCOL[s])}
   break}
  case'leave':{towers=towers.filter(t=>t.o!==p.id);delete players[p.id];say(p.nm+' left','#8a97c8');break}
  case'build':err=doBuild(p,m.i|0,m.k);break;
  case'up':err=doUp(p,m.i|0);break;
  case'sell':err=doSell(p,m.i|0);break;
  case'nova':err=useNova(p);if(nova)nova.byId=p.id;break;
  case'vote':if(state==='cards'&&p.s>=0&&choices[m.c|0]){votes[p.id]=m.c|0}break;
  case'ready':if(state==='prep'&&p.s>=0)p.rd=!!m.v;break;
 }
 if(err)toast(p,err);

/* ---------- update ---------- */
function update(dt){
 T+=dt;
 for(const s of stars){s.y+=s.v*dt;if(s.y>FH){s.y=0;s.x=Math.random()*FW}}
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
 for(let i=feed.length-1;i>=0;i--){feed[i].t-=dt;if(feed[i].t<=0)feed.splice(i,1)}
 shake=Math.max(0,shake-dt*28);hurt=Math.max(0,hurt-dt*1.4);flashW=Math.max(0,flashW-dt*2.2);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}if(!p.ring&&!p.fl){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97}}
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt;f.y-=22*dt;if(f.t<=0)floats.splice(i,1)}
 for(let i=beams.length-1;i>=0;i--){beams[i].t-=dt;if(beams[i].t<=0)beams.splice(i,1)}
 for(const t of towers)if(t.fl>0)t.fl-=dt;
 updateNova(dt);
 /* drop long-gone players */
 const now=Date.now();
 for(const id in players){const p=players[id];if(now-p.seen>90000||(p.bye&&now-p.bye>30000)){towers=towers.filter(t=>t.o!==id);delete players[id];snapDirty=true}}
 snapT-=dt;if(snapT<=0){snapT=.25;snapDirty=true}
 if(state==='prep'){
  const act=stationed();
  if(!act.length){prepT=45;startIn=null}
  else if(act.every(p=>p.rd)){if(startIn==null)startIn=2.5;startIn-=dt;if(startIn<=0)startWave()}
  else{startIn=null;prepT-=dt;if(prepT<=0)startWave()}
  return;
 }
 if(state==='cards'){
  voteT-=dt;const act=stationed();
  if(voteT<=0||(act.length&&act.every(p=>votes[p.id]!==undefined)))resolveVotes();
  return;
 }
 if(state==='over'){overT-=dt;if(overT<=0){newRound();pushSnap()}return}
 if(state!=='wave')return;
 if(queue.length){spawnT-=dt;if(spawnT<=0){const ty=queue.shift();spawn(ty);spawnT=ty==='swarm'?.1:Math.max(.12,(1-G.wave*.025)/Math.max(1,stationed().length*.7))}}
 for(const e of enemies){
  if(e.hp<=0)continue;
  if(e.st>0){e.st-=dt;if(e.st<=0)e.sa=0}
  if(e.fl>0)e.fl-=dt;
  e.y+=e.sp*(1-(e.st>0?e.sa:0))*dt;
  if(e.k!=='tank'&&e.k!=='boss'){e.x+=Math.sin(T*2+e.ph)*10*dt;e.x=Math.max(e.r,Math.min(FW-e.r,e.x))}
  if(e.y>=WALL-e.r){
   G.hp-=e.fd;e.hp=0;boom(e.x,WALL-4,e.r*2.2,'#ff3050');hurt=Math.min(1,hurt+.5+e.fd/30);shake=Math.max(shake,3+e.fd*.4);
   if(G.hp<=0){G.hp=0;gameOver();return}
  }
 }
 for(const t of towers){if(t.cd>0)t.cd-=dt;if(t.cd<=0){if(!fire(t))t.cd=.1}}
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.life-=dt;b.px=b.x;b.py=b.y;
  if(b.tg&&b.tg.hp>0){const a=Math.atan2(b.tg.y-b.y,b.tg.x-b.x);b.vx=Math.cos(a)*b.sp;b.vy=Math.sin(a)*b.sp}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  let rm=b.life<=0||b.y<TOPY-20||b.x<-20||b.x>FW+20||b.y>FH;
  if(!rm){
   for(const e of enemies){
    if(e.hp<=0||(b.hit&&b.hit.has(e)))continue;
    if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){
     hitB(b,e);
     if(b.k===0){b.hit.add(e);b.tg=null;if(b.pr<=0)rm=true;else b.pr--}else rm=true;
     if(rm||b.k!==0)break;
    }
   }
  }
  if(rm)bullets.splice(i,1);
 }
 enemies=enemies.filter(e=>e.hp>0);
 if(state==='wave'&&!queue.length&&!enemies.length)waveClear();
}

 x.fillStyle='#fff';x.fillRect(0,0,n*m,n*m);x.fillStyle='#000';
 for(let r=0;r<qrN;r++)for(let q=0;q<qrN;q++)if(qrM[r*qrN+q])x.fillRect((q+4)*m,(r+4)*m,m,m);
 return qrCache[m]=c;
}
function drawQR(x,y,m){
 const sz=qrSize(m);
 if(!qrN){ctx.fillStyle='#fff';rr(x,y,sz,sz,8);ctx.fill();txt('QR',x+sz/2,y+sz/2,20,'#222','center');return sz}
 ctx.imageSmoothingEnabled=false;ctx.drawImage(qrImg(m),x,y,sz,sz);ctx.imageSmoothingEnabled=true;return sz;
}

 txt('ENEMIES '+(enemies.length+queue.length)+'    KILLS '+G.kills+'    BEST WAVE '+best,FW/2,50,13,'#8a97c8','center','600');
 for(let i=1;i<=3;i++){const bx2=300+(i-1)*52,on=SPEED===i;ctx.fillStyle=on?'#35e6ff':'rgba(255,255,255,.12)';rr(bx2,14,46,22,11);ctx.fill();txt(i+'x',bx2+23,25,13,on?'#06101f':'#cfe',  'center','800')}

 ctx.fillStyle='rgba(255,255,255,.1)';rr(nx,14,nw,22,11);ctx.fill();

  ctx.fillStyle='rgba(255,30,60,'+(.12+.1*f)+')';ctx.fillRect(0,0,FW,FH);
  ctx.fillStyle='rgba(255,48,80,.85)';ctx.fillRect(0,250,FW,6);ctx.fillRect(0,400,FW,6);

  txt(banner.sub,FW/2,365,34,'#ffffff','center','800',12);
 }else{
  txt(banner.txt,FW/2,280,80,banner.col,'center','800',26);
  if(banner.sub)txt(banner.sub,FW/2,345,26,'#ffffff','center','700',8);
 }
 ctx.restore();
}
function drawFeed(){
 feed.forEach((f,i)=>{ctx.globalAlpha=Math.min(1,f.t);txt(f.s,16,TOPY+20+i*22,15,f.col,'left','700');ctx.globalAlpha=1});

function drawPrep(){
 const act=stationed();
 if(G.wave===0){
  ctx.fillStyle='rgba(3,5,16,.62)';ctx.fillRect(0,TOPY,FW,WALL-TOPY);
  const px=130,py=118;
  txt('STAR BASTION  CO-OP',FW/2,py,54,'#35e6ff','center','800',24);
  txt('Scan the code on your phone, pick a station, defend the fortress together',FW/2,py+48,20,'#c9d4ff','center','600');
  drawQR(FW/2-342,py+83,5);
  txt('ROOM CODE',FW/2+60,py+120,16,'#8a97c8','left','700');
  txt(ROOM,FW/2+60,py+170,78,'#ffe03d','left','800',18);
  txt(shortUrl(),FW/2+60,py+232,17,'#c9d4ff','left','600');
  const left=act.length?Math.ceil(prepT):'';
  txt(act.length?act.length+' player'+(act.length>1?'s':'')+' ready to defend  ·  starts in '+left+'s  (Space = start now)':'Waiting for the first player...',FW/2,py+358,20,act.length?'#5dff7a':'#8a97c8','center','700');
  txt(netMode==='supabase'?(netStatus==='online'?'ONLINE':(netStatus==='error'?'CONNECTION FAILED':'connecting...')+' ['+netDetail+'] '+((window.SBNet.getCfg()||{}).u||'')+' k'+(((window.SBNet.getCfg()||{}).k)||'').length+' '+(((window.SBNet.getCfg()||{}).k)||'').slice(0,6)+'  (tap to re-enter keys)'):'LOCAL MODE: tap here (or press K) to add Supabase keys.',FW/2,py+390,14,netMode==='supabase'?'#5dff7a':'#ffb06a','center','600');
 }else{
  const rd=act.filter(p=>p.rd).length;
  txt('NEXT: WAVE '+(G.wave+1)+(((G.wave+1)%5===0)?'  ⚠ BOSS':''),FW/2,TOPY+60,40,((G.wave+1)%5===0)?'#ff5577':'#35e6ff','center','800',16);
  txt('Build & upgrade on your phones   ·   ready '+rd+'/'+act.length+'   ·   starts in '+Math.ceil(startIn!=null?startIn:prepT)+'s',FW/2,TOPY+100,20,'#c9d4ff','center','600');
  if(lastResult)txt('Team upgrade: '+lastResult,FW/2,TOPY+132,18,'#ffe03d','center','700');
 }

function drawCards(){
 ctx.fillStyle='rgba(3,5,16,.74)';ctx.fillRect(0,0,FW,FH);
 txt('WAVE '+G.wave+' CLEARED',FW/2,100,48,'#5dff7a','center','800',18);
 txt('Vote for a team upgrade on your phones  ·  '+Math.ceil(voteT)+'s',FW/2,150,20,'#c9d4ff','center','600');
 const tally=choices.map(()=>0);for(const id in votes)tally[votes[id]]++;
 const act=stationed().length||1;
 choices.forEach((c,i)=>{
  const w=340,h=250,x=FW/2-w*1.5-30+i*(w+30),y=210;
  const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#1a2858');g.addColorStop(1,'#0d1530');
  ctx.fillStyle=g;rr(x,y,w,h,16);ctx.fill();
  ctx.strokeStyle=c.col;ctx.shadowColor=c.col;ctx.shadowBlur=14;ctx.lineWidth=2.5;rr(x,y,w,h,16);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=c.col;ctx.shadowColor=c.col;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(x+w/2,y+56,24,0,6.28);ctx.fill();ctx.shadowBlur=0;
  txt(c.n,x+w/2,y+112,24,'#ffffff','center','800');
  txt(c.d,x+w/2,y+148,15,'#aab6e6','center','500');
  ctx.fillStyle='rgba(255,255,255,.1)';rr(x+30,y+190,w-60,16,8);ctx.fill();
  ctx.fillStyle=c.col;rr(x+30,y+190,Math.max(0,(w-60)*tally[i]/act),16,8);ctx.fill();
  txt(tally[i]+' vote'+(tally[i]===1?'':'s'),x+w/2,y+226,15,'#ffffff','center','700');
 });
}
function drawOver(){
 ctx.fillStyle='rgba(3,5,16,.82)';ctx.fillRect(0,0,FW,FH);
 txt('FORTRESS DOWN',FW/2,130,76,'#ff3050','center','800',26);
 txt('Your team reached wave '+G.wave,FW/2,205,32,'#ffffff','center','700');
 txt('Total kills '+G.kills+'   ·   Best wave '+best,FW/2,248,20,'#ffe03d','center','700');
 const list=Object.values(players).filter(p=>p.s>=0).sort((a,b)=>b.kills-a.kills).slice(0,6);
 list.forEach((p,i)=>{
  const y=310+i*46,col=SCOL[p.s];
  txt((i===0?'★ ':'')+p.nm,FW/2-220,y,24,col,'left','800',i===0?10:0);
  txt(p.kills+' kills',FW/2+220,y,22,'#ffffff','right','700');
 });
 txt('New round starts in '+Math.ceil(overT)+'s',FW/2,640,20,'#8a97c8','center','600');

function draw(){
 ctx.setTransform(1.5,0,0,1.5,0,0);
 drawSpace();
 ctx.save();
 ctx.beginPath();ctx.rect(0,0,FW,FH);ctx.clip();
 const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0;
 ctx.translate(sx,sy);
 drawGameBg();
 drawStations();
 const lod=enemies.length>90;
 for(const e of enemies)drawEnemy(e,lod);
 for(const t of towers)drawTower(t);
 drawFx();drawNova();drawHud();drawFeed();
 if(state==='prep')drawPrep();
 if(state!=='over'&&!(state==='prep'&&G.wave===0))drawMiniJoin();
 drawBanner();
 if(qrBig){ctx.fillStyle='rgba(3,5,16,.86)';ctx.fillRect(0,0,FW,FH);drawQR(FW/2-qrSize(8)/2,100,8);txt('ROOM '+ROOM,FW/2,560,56,'#ffe03d','center','800',16);txt('tap or press Q to close',FW/2,620,16,'#8a97c8','center','600')}
 if(hurt>0){const vg=ctx.createRadialGradient(FW/2,FH/2,FH*.3,FW/2,FH/2,FH*.9);vg.addColorStop(0,'rgba(255,30,60,0)');vg.addColorStop(1,'rgba(255,30,60,'+(hurt*.5)+')');ctx.fillStyle=vg;ctx.fillRect(0,0,FW,FH)}
 if(flashW>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(1,flashW*.75)+')';ctx.fillRect(0,0,FW,FH)}
 if(state==='cards')drawCards();
 if(state==='over')drawOver();
 ctx.restore();
}

/* ---------- loop ---------- */
let lastT=Date.now(),ticker=false;
const ENK=['scout','grunt','swarm','shield','splitter','tank','boss'];
function sendFx(){
 if(!net)return;
 const has=enemies.length||bullets.length||nova;
 if(!has&&!fxHad)return;
 fxHad=!!has;
 net.send({t:'fx',e:enemies.slice(0,150).map(o=>[o.id,Math.round(o.x),Math.round(o.y),ENK.indexOf(o.k),Math.round(Math.max(0,o.hp)/o.mhp*100)]),
  b:bullets.slice(0,80).map(b=>[Math.round(b.x),Math.round(b.y),Math.round(b.vx),Math.round(b.vy),b.k]),
  nv:nova?(nova.ph==='blast'?Math.round(nova.y):-2):-1});
}
let SPEED=1;function setSpeed(v){SPEED=v;snapDirty=true}
function tick(){const n=Date.now(),dt=Math.min(.1,(n-lastT)/1000);lastT=n;let r=dt*SPEED;while(r>0){const d=Math.min(.05,r);update(d);r-=d}sendSnap();if(n-lastFx>=125){lastFx=n;try{sendFx()}catch(e){}}}
try{const bl=new Blob(['setInterval(function(){postMessage(0)},50)'],{type:'text/javascript'});const w=new Worker(URL.createObjectURL(bl));w.onmessage=tick;ticker=true}catch(e){ticker=false}
function frame(){if(!ticker)tick();draw();requestAnimationFrame(frame)}
async function wl(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
wl();addEventListener('visibilitychange',()=>{if(!document.hidden)wl()});
function cfgPrompt(){
  const u=prompt('Supabase project URL (https://xxxx.supabase.co)',(window.SBNet.getCfg()||{}).u||'');
  if(u===null)return;
  const kk=prompt('Supabase anon (public) key',(window.SBNet.getCfg()||{}).k||'');
  if(kk===null)return;
  if(u&&kk)window.SBNet.setCfg(u.trim(),kk.trim());else window.SBNet.clearCfg();
  location.reload();
}
cv.addEventListener('click',e=>{
 const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width*FW,fy=(e.clientY-r.top)/r.height*FH;
 if(fy>=14&&fy<=36&&fx>=300&&fx<=300+156){setSpeed(Math.min(3,Math.floor((fx-300)/52)+1));return}
 if(qrBig){qrBig=false;return}
 if(fx>FW-qrSize(4)-20&&fy>TOPY&&fy<TOPY+qrSize(4)+60&&state!=='over'&&!(state==='prep'&&G.wave===0)){qrBig=true;return}
 if(state==='prep'&&G.wave===0&&fy/FH>.55&&fy/FH<.8)cfgPrompt();
});
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k===' '||k==='enter'){e.preventDefault();if(state==='prep'&&stationed().length)startWave();else if(state==='cards')resolveVotes();else if(state==='over'){newRound();pushSnap()}}
 else if(k==='n'){const r=useNova(null);if(r)say(r,'#ffb06a')}
 else if(k==='q'){qrBig=!qrBig}
 else if(k==='1'||k==='2'||k==='3'){setSpeed(+k)}
 else if(k==='f'){try{document.documentElement.requestFullscreen()}catch(err){}}
 else if(k==='k'){
  const u=prompt('Supabase project URL (https://xxxx.supabase.co)',(window.SBNet.getCfg()||{}).u||'');
  if(u===null)return;
  const kk=prompt('Supabase anon (public) key',(window.SBNet.getCfg()||{}).k||'');
  if(kk===null)return;
  if(u&&kk)window.SBNet.setCfg(u.trim(),kk.trim());else window.SBNet.clearCfg();
  location.reload();
 }
});

newRound();
net=window.SBNet.open(ROOM,onMsg,(s,d)=>{netStatus=s;netDetail=d||'';if(s==='online'||s==='local')pushSnap()});
netMode=net.mode;
makeQR();
window.__host={sendFx,onMsg,update,draw,sendSnap,snapshot,get state(){return state},get G(){return G},players,get enemies(){return enemies},get towers(){return towers},startWave,newRound,get net(){return net},ROOM};
requestAnimationFrame(frame);
})();
